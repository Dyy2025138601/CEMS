<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register account</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>

<div class="register-page">
    <div class="register-card">
        <div class="register-left">
            <div class="logo-wrapper">
                <div class="logo-circle">
                    <img src="icon/logo.png" alt="Logo">
                </div>
            </div>
            <h1 class="system-title">
                Catering Equipment<br>
                Management System
            </h1>
        </div>

        <div class="register-right">
            <h2 class="register-title">Create Your Account</h2>

            <div class="role-group">
                <label class="role-option">
                    <input type="radio" name="role">
                    <span>Manager</span>
                </label>
                <label class="role-option">
                    <input type="radio" name="role">
                    <span>Coordinator</span>
                </label>
            </div>

            <input type="text" placeholder="Name" class="register-input">
            <input type="email" placeholder="Email" class="register-input">
            <input type="password" placeholder="Password" class="register-input">
            <input type="password" placeholder="Confirm Password" class="register-input">
            <input type="number" placeholder="Phone Number" class="register-input">

            <button type="button" class="register-btn" id="regBtn" onclick="handleRegistration()">
                Register
            </button>

            <p class="login-text">
                Already have an account?
                <a href="login.html">Log In</a>
            </p>
        </div>
    </div>
</div>
<div id="customAlert" class="modal-overlay">
    <div class="modal-content">
        <p>Account successfully registered! You can now login your account.</p>
        <div class="modal-footer">
            <button type="button" class="modal-ok-btn" onclick="closeAlert()">OK</button>
        </div>
    </div>
</div>

<script>
function handleRegistration() {
    // Shows the modal
    document.getElementById('customAlert').style.display = 'flex';
}

function closeAlert() {
    // Hides the modal
    document.getElementById('customAlert').style.display = 'none';
    // Redirects
    window.location.href = "verify.html";
}
</script>
</body>
</html>
