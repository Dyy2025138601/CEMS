<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Return Equipment Form</title>
    <link rel="stylesheet" href="farah1.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
	@import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap');
	</style>
</head>
<body>

    <div class="sidebar">
        <div class="profile-section">
            <div class="profile-pic-default">
               <img src="icon/user.png" alt="profile_image">
            </div>
            <span class="manager-text">Event Coordinator</span>
        </div>
        
        <hr class="divider">

         <nav class="nav-menu">
            <a href="dashEC.html" class="nav-item">
                <img src="icon/dashboard.png" alt="Dashboard" class="nav-icon"> Dashboard
            </a>
            <a href="" class="nav-item active">
                <img src="icon/event.png" class="nav-icon"> Event
            </a>
        </nav>

        <div class="logout-section">
            <a href="#" class="nav-icon-logout">
               <img src="icon/logout.png">Log Out
            </a>
        </div>
    </div>
	
	<!-- main content page -->
    <main class="main-content">
        <div class="content-box">
            <h1 class="page-title">Event Details</h1>
            
			<!-- table -->
			<div class="table-group">
			<h1 class="table-title">Equipment Included</h1>
	        </div>
	            
            <div class="table-wrapper">
                <table class="package-table">
                	<colgroup>
				    <col style="width: 18%">
				    <col style="width: 22%">
				    <col style="width: 18%">
				    <col style="width: 18%">
				    <col style="width: 30%">
				 	</colgroup>
                    <thead>
                        <tr>
                            <th>Eqp ID</th>
                            <th>Name</th>
                            <th>Serving Set</th>
                            <th>Function</th>
                            <th>Quantity Return</th>
                        </tr>
                    </thead>
                    <tbody class="body-row">
                        <tr>
                        	<td>E001</td>
                            <td>Large Pot</td>
                            <td class="muted">N/A</td>
                            <td>Storage</td>
                            <td>
						        <input type="number" name="newQty" id="newQty" value="11" min="0" class="quantity-input" />
						    </td>
                        </tr>
                        <tr>
                        	<td>E002</td>
                            <td>Buffet</td>
                            <td>Guest</td>
                            <td class="muted">N/A</td>
                            <td>
						        <input type="number" name="newQty" id="newQty" value="12" min="0" class="quantity-input" />
						    </td>
                        </tr>
                        <tr>
                        	<td>E003</td>
                            <td>Insert</td>
                            <td>Guest</td>
                            <td class="muted">N/A</td>
                            <td>
						        <input type="number" name="newQty" id="newQty" value="24" min="0" class="quantity-input" />
						    </td>
                        </tr>
                        <tr>
                        	<td>E004</td>
                            <td>Plate</td>
                            <td>Guest</td>
                            <td class="muted">N/A</td>
                            <td>
						        <input type="number" name="newQty" id="newQty" value="5000" min="0" class="quantity-input" />
						    </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
           <!-- button -->
           <div class="table-actions">
			  <button class="btn btn-reset">Reset</button>
			  <button class="btn btn-save" onclick="showModal()">Submit</button>
			</div>
        </div>
    </main>
	
	<!-- Success Modal -->
    <div class="modal-overlay" id="successModal">
	    <div class="modal-box">
	        <button class="modal-close" onclick="closeModal()">×</button>
	
	        <h2>Equipment Return Successfully<br>Submitted</h2>
	
	        <div class="success-icon">
	            <i class="fas fa-check"></i>
	        </div>
	    </div>
	</div>
	
    <script>
		  const inputs = document.querySelectorAll('.quantity-input');
		
		  // Store original values
		  inputs.forEach(input => {
		    input.dataset.original = input.value;
		  });
		
		  document.querySelector('.btn-reset').addEventListener('click', () => {
		    inputs.forEach(input => {
		      input.value = input.dataset.original;
		      input.closest('tr').classList.remove('edited');
		    });
		  });
		
		  
	</script>

	<script>
	    function showModal() {
	        document.getElementById("successModal").style.display = "flex";
	    }
	
	    function closeModal() {
	        // hide modal
	        document.getElementById("successModal").style.display = "none";
	
	        // redirect to Event List page
	        window.location.href = "viewEventList.html";
	    }
	
	    // Close modal when clicking outside
	    document.getElementById("successModal").addEventListener("click", function (e) {
	        if (e.target === this) {
	            closeModal();
	        }
	    });
	</script>
	
</body>
</html>
