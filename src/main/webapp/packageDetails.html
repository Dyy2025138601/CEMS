<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Package Details</title>
    <link rel="stylesheet" href="farah1.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
	@import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap');
	</style>
</head>
<body>

    <div class="sidebar">
        <div class="profile-section">
            <div class="profile-pic-default">
               <img src="icon/user.png" alt="profile_image">
            </div>
            <span class="manager-text">Manager</span>
        </div>
        
        <hr class="divider">

        <nav class="nav-menu">
            <a href="dashboard.html" class="nav-item">
                <img src="icon/dashboard.png" alt="Dashboard" class="nav-icon"> Dashboard
            </a>
            <a href="equipment.html" class="nav-item">
                <img src="icon/eqp.png" class="nav-icon"> Equipment
            </a>
            <a href="#" class="nav-item">
                <img src="icon/event.png" class="nav-icon"> Event
            </a>
            <a href="viewPackageList.html" class="nav-item active">
                <img src="icon/package.png" class="nav-icon"> Package
            </a>
            <a href="EClist.html" class="nav-item">
                <img src="icon/coordinator.png" class="nav-icon"> Coordinator
            </a>
            <a href="viewReportList.html" class="nav-item">
                <img src="icon/report.png" class="nav-icon"> Report
            </a>
        </nav>

        <div class="logout-section">
            <a href="logout.html" class="nav-icon-logout">
               <img src="icon/logout.png">Log Out
            </a>
        </div>
    </div>
	
	<!-- main content page -->
    <main class="main-content">
        <div class="content-box">
            <h1 class="page-title">Package A</h1>
         	
           	<div class="page-info">
                <div class="info-group">
                    <p class="package-id">Package ID: P0A</p>
                    <p class="package-">Pax: 1000 - 1500</p>
                </div>
            </div>
			
			<!-- table -->
			<div class="table-group">
			<h1 class="table-title">Equipment Included</h1>
				<button class="update-btn" onclick="document.location='updatePackage.html'"><i class="fas fa-edit"></i> Update quantity</button>
	        </div>
	            
            <div class="table-wrapper">
                <table class="package-table">
                	<colgroup>
				    <col style="width: 18%">
				    <col style="width: 22%">
				    <col style="width: 18%">
				    <col style="width: 18%">
				    <col style="width: 30%">
				 	</colgroup>
                    <thead>
                        <tr>
                            <th>Eqp ID</th>
                            <th>Name</th>
                            <th>Serving Set</th>
                            <th>Function</th>
                            <th>Quantity Required</th>
                        </tr>
                    </thead>
                    <tbody class="body-row">
                        <tr>
                        	<td>E001</td>
                            <td>Large Pot</td>
                            <td class="muted">N/A</td>
                            <td>Storage</td>
                            <td>11</td>
                        </tr>
                        <tr>
                        	<td>E002</td>
                            <td>Buffet</td>
                            <td>Guest</td>
                            <td class="muted">N/A</td>
                            <td>12</td>
                        </tr>
                        <tr>
                        	<td>E003</td>
                            <td>Insert</td>
                            <td>Guest</td>
                            <td class="muted">N/A</td>
                            <td>24</td>
                        </tr>
                        <tr>
                        	<td>E004</td>
                            <td>Plate</td>
                            <td>Guest</td>
                            <td class="muted">N/A</td>
                            <td>5000</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            </div>
    </main>

    <script>
        function setTab(btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>
</body>
</html>
