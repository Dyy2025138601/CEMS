<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="dija1.css">
</head>
<body>
	<div class="sidebar">
        <div class="profile-section">
          <a href="account.html" class="profile-link">
            <div class="profile-pic-default">
               <img src="icon/user.png" alt="profile_image">
            </div></a>
            <span class="manager-text">Manager</span>
        </div>

        <hr class="divider">

        <nav class="nav-menu">
            <a href="dashboard.html" class="nav-item">
                <img src="icon/dashboard.png" class="nav-icon"> Dashboard
            </a>
            <a href="equipment.html" class="nav-item">
                <img src="icon/eqp.png" class="nav-icon"> Equipment
            </a>
            <a href="ViewEventList.html" class="nav-item active">
                <img src="icon/event.png" class="nav-icon"> Event
            </a>
            <a href="viewPackageList.html" class="nav-item">
                <img src="icon/package.png" class="nav-icon"> Package
            </a>
            <a href="EClist.html" class="nav-item">
                <img src="icon/coordinator.png" class="nav-icon"> Coordinator
            </a>
            <a href="viewReportList.html" class="nav-item">
                <img src="icon/report.png" class="nav-icon"> Report
            </a>
        </nav>

        <div class="logout-section">
            <a href="logout.html" class="nav-item logout">
                <img src="icon/logout.png" class="nav-icon"> Log Out
            </a>
        </div>
    </div>
    
    <main class="main-content">
    <div class="content-box">

        <h2 class="page-title">Create New Event</h2>
        <p class="page-desc">Please enter required information.</p>

        <!-- Event Info Form Card -->
        <div class="event-details-card" id="eventFormCard">
		    <div class="event-details-row">
		        <div class="event-field-inline">
		            <label for="eventId">Event ID:</label>
		            <input type="text" id="eventId" value="E004" class="field-input highlight-readonly" readonly>
		        </div>
		        <div class="event-field-inline">
		            <label for="eventTime">Event Time:</label>
		            <select id="eventTime" class="field-input">
					    <option value="">Select time</option>
					    <option value="10:00">10.00 AM</option>
					    <option value="12:00">12.00 PM</option>
					    <option value="14:00">2.00 PM</option>
					    <option value="16:00">4.00 PM</option>
					    <option value="18:00">6.00 PM</option>
					</select>
		        </div>
		        <div class="event-field-inline">
		            <label for="venue">Venue:</label>
		            <input type="text" id="venue" value="" class="field-input">
		        </div>
		    </div>
		
		    <div class="event-details-row">
			    <div class="event-field-inline">
			        <label for="eventName">Event Name:</label>
			        <input type="text" id="eventName" class="field-input">
			    </div>
			
			    <div class="event-field-inline">
			        <label for="eventDate">Event Date:</label>
			        <input type="date" id="eventDate" class="field-input">
			    </div>
			
			    <div class="event-field-inline">
			        <label for="pax">No of Pax:</label>
			        <input type="number" id="pax" class="field-input">
			    </div>
			</div>
			
			<!-- Pax message UNDER the whole row -->
			<div class="pax-row-message" id="paxHint">
			    * Maximum 300 pax allowed based on equipment availability
			</div>

		</div>

      <!-- PACKAGE SECTION -->
		<div class="package-wrapper" id="packageSection">
		
		   <!-- ROW 1 -->
    	   <div class="package-header-row">
    	    <!-- LEFT -->
		    <h3>
		        Package Selected :
		        <span class="orange-text" id="packageName">None</span>
		    </h3>
		   
		<!-- RIGHT--> 
		<!-- ASSIGN COORDINATOR (SEPARATE) -->
		<div class="assign-coordinator">
		    <label for="coordinator">
		        Assign Coordinator :
		    </label>
		    <select id="coordinator" class="coordinator-select">
		        <option value="">Select Coordinator</option>
		        <option value="C001">Hawa Aqiera</option>
		        <option value="C002">Farah Nabila</option>
		        <option value="C003">Khadijah Saqifah</option>
		    </select>
		</div>
	</div>
	
	<!-- ROW 2 -->
	<p class="package-desc" id="packageDesc"></p>
	
	</div>



        <div class="equipment-table-wrapper"> 
            <table class="equipment-table"> 
                <thead> 
                    <tr> 
                        <th>Equipment ID</th> 
                        <th>Equipment Name</th> 
                        <th>Quantity</th> 
                        <th>Category</th> 
                    </tr> 
                </thead> 
                <tbody id="equipmentTableBody"> <!-- auto generated --> 

                </tbody> 
            </table> 
        </div> 
    </div>

        <!-- Buttons -->
        <div class="form-buttons">
            <button type="button" id="resetBtn" class="reset-btn">Reset</button>
            <button type="submit" class="submit-btn" onclick="showModal()">Submit</button>
        </div>
	</main>
	
		<!-- Success Modal -->
		<div class="modal-overlay" id="successModal">
		    <div class="modal-box">
		        <button class="modal-close" onclick="closeModal()">×</button>
		
		        <h2>Event Successfully<br>Created</h2>
		
		        <div class="success-icon">
		            <i class="fas fa-check"></i>
		        </div>
		    </div>
		</div>

	<script>
/* ---------------- RESET BUTTON ---------------- */
document.getElementById('resetBtn').addEventListener('click', function() {
	        // select all inputs inside the event form card
	        const inputs = document.querySelectorAll('#eventFormCard .field-input');
	        inputs.forEach(input => {
	            if (!input.hasAttribute('readonly')) {
	                input.value = ''; // clear editable input
	            }
	        });
	    });


/* ---------------- PACKAGE DATA ---------------- */
const packages = {
    A: {
        maxPax: 100,
        name: "Package A",
        desc: "Equipment included for small events",
        equipment: [
            { id: "S001", name: "Buffet Tray", qty: 20, cat: "Service" },
            { id: "S002", name: "Water Dispenser", qty: 2, cat: "Service" },
            { id: "D003", name: "Glass", qty: 100, cat: "Service" }
        ]
    },
    B: {
        maxPax: 200,
        name: "Package B",
        desc: "Equipment included for medium events",
        equipment: [
            { id: "S001", name: "Buffet Tray", qty: 30, cat: "Service" },
            { id: "D002", name: "Plate", qty: 200, cat: "Service" },
            { id: "P003", name: "Sink", qty: 2, cat: "Support" }
        ]
    }
};


/* ---------------- PAX + PACKAGE LOGIC ---------------- */
const paxInput = document.getElementById("pax");
const paxHint = document.getElementById("paxHint");

const packageSection = document.getElementById("packageSection");
const packageName = document.getElementById("packageName");
const packageDesc = document.getElementById("packageDesc");
const equipmentBody = document.getElementById("equipmentTableBody");

const MAX_PAX = 300;

paxInput.addEventListener("input", function () {
    const pax = parseInt(this.value);

    /* ---------- RED WARNING MESSAGE ---------- */
    if (pax > MAX_PAX) {
        paxHint.classList.add("show");
    } else {
        paxHint.classList.remove("show");
    }


    /* ---------- PACKAGE SELECTION ---------- */
    let selectedPackage = null;

    if (!pax || pax <= 0) {
        packageSection.style.display = "block";
        packageName.textContent = "None";
        packageDesc.textContent = "";
        equipmentBody.innerHTML = "";
        return;
    }

    if (pax <= packages.A.maxPax) {
        selectedPackage = packages.A;
    } else if (pax <= packages.B.maxPax) {
        selectedPackage = packages.B;
    }

    if (!selectedPackage) {
        packageSection.style.display = "block";
        packageName.textContent = "None";
        packageDesc.textContent = "";
        equipmentBody.innerHTML = "";
        return;
    }

    /* ---------- DISPLAY PACKAGE ---------- */
    packageSection.style.display = "block";
    packageName.textContent = selectedPackage.name;
    packageDesc.textContent = selectedPackage.desc;

    equipmentBody.innerHTML = "";
    selectedPackage.equipment.forEach(eq => {
        equipmentBody.innerHTML += `
            <tr>
                <td>${eq.id}</td>
                <td>${eq.name}</td>
                <td>${eq.qty}</td>
                <td>${eq.cat}</td>
            </tr>
        `;
    });
});
</script>


	<script>
	    function showModal() {
	        document.getElementById("successModal").style.display = "flex";
	    }
	
	    function closeModal() {
	        // hide modal
	        document.getElementById("successModal").style.display = "none";
	
	        // redirect to Event List page
	        window.location.href = "ViewEventList.html";
	    }
	
	    // Close modal when clicking outside
	    document.getElementById("successModal").addEventListener("click", function (e) {
	        if (e.target === this) {
	            closeModal();
	        }
	    });
	</script>

</body>
</html>
